name: Unique non-production version

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nonprod-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Generate immutable non-production Maven version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          project_version="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          short_sha="${GITHUB_SHA::8}"

          if [[ "${project_version}" == *-SNAPSHOT ]]; then
            base_version="${project_version%-SNAPSHOT}"
            build_version="${base_version}-${short_sha}-SNAPSHOT"
          else
            build_version="${project_version}-${short_sha}"
          fi

          mvn -B org.codehaus.mojo:versions-maven-plugin:2.18.0:set \
            -DnewVersion="${build_version}" \
            -DgenerateBackupPoms=false

          echo "build_version=${build_version}" >> "${GITHUB_OUTPUT}"
          echo "### Non-production version" >> "${GITHUB_STEP_SUMMARY}"
          echo "\`${build_version}\`" >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify non-production build
        run: mvn -B test
