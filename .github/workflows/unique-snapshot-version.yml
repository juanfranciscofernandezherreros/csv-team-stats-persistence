name: Unique snapshot version

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Generate unique Maven snapshot version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          base_version="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          base_version="${base_version%-SNAPSHOT}"
          short_sha="${GITHUB_SHA::8}"
          snapshot_version="${base_version}-${short_sha}-SNAPSHOT"

          mvn -B org.codehaus.mojo:versions-maven-plugin:2.18.0:set \
            -DnewVersion="${snapshot_version}" \
            -DgenerateBackupPoms=false

          echo "snapshot_version=${snapshot_version}" >> "${GITHUB_OUTPUT}"
          echo "### Snapshot version" >> "${GITHUB_STEP_SUMMARY}"
          echo "\`${snapshot_version}\`" >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify snapshot build
        run: mvn -B test
