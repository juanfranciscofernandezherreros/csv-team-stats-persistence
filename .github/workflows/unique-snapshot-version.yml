name: CI-friendly non-production version
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nonprod-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Resolve immutable build version
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::8}"
          build_version="$(mvn -q -DforceStdout -Dsha1="-${short_sha}" help:evaluate -Dexpression=project.version)"
          echo "Build version: ${build_version}"
      - name: Verify non-production build
        run: |
          short_sha="${GITHUB_SHA::8}"
          mvn -B -Dsha1="-${short_sha}" test
