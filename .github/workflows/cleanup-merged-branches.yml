name: cleanup-merged-branches

on:
  pull_request:
    types: [closed]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const stale = ["feature/team-stats-persistence"];

            async function remove(branch) {
              if (!branch || branch === 'main') return;
              try {
                await github.rest.git.deleteRef({owner, repo, ref: `heads/${branch}`});
                core.info(`Deleted branch: ${branch}`);
              } catch (error) {
                if (error.status === 404 || error.status === 422) return;
                throw error;
              }
            }

            for (const branch of stale) await remove(branch);

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'closed', base: 'main', per_page: 100
            });
            for (const pr of pulls) {
              if (pr.merged_at && pr.head.repo?.full_name === `${owner}/${repo}`) {
                await remove(pr.head.ref);
              }
            }
