name: main-guard

on:
  push:
    branches: [ main ]

jobs:
  reject-direct-main-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Reject direct non-merge commits to main
        shell: bash
        run: |
          set -euo pipefail
          parent_count=$(($(git rev-list --parents -n 1 HEAD | wc -w) - 1))
          if (( parent_count < 2 )); then
            echo "ERROR: direct pushes to main are forbidden; use a Pull Request"
            exit 1
          fi
          echo "GitHub merge commit detected on main."
