spring:
  application:
    name: csv-team-stats-persistence
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:csv-team-stats-persistence}
      auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET:earliest}
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: io.confluent.kafka.serializers.KafkaAvroDeserializer
        spring.deserializer.value.delegate.class: io.confluent.kafka.serializers.KafkaAvroDeserializer
    properties:
      schema.registry.url: ${KAFKA_SCHEMA_REGISTRY_URL}
      specific.avro.reader: true
app:
  kafka:
    topics:
      parsed-team-stats: ${KAFKA_PARSED_TEAM_STATS_TOPIC:team-stats.parsed}
      dlt: ${KAFKA_TEAM_STATS_PERSISTENCE_DLT_TOPIC:team-stats.parsed.DLT}
    error:
      max-attempts: ${KAFKA_RETRY_MAX_ATTEMPTS:3}
      backoff-ms: ${KAFKA_RETRY_BACKOFF_MS:1000}
